name: MONOA iOS Unsigned Build (Manual)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout ios-packaging
        uses: actions/checkout@v4

      - name: Select Xcode 26.6 explicitly
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcode-select -p

      - name: Environment report
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          node --version
          npm --version

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Build unsigned device target (no archive, no export)
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -target App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Verify App.app output
        run: |
          APP_PATH="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/App.app"
          echo "Checking $APP_PATH"

          if [ ! -d "$APP_PATH" ]; then
            echo "FAIL: App.app not found at expected path"
            find "$GITHUB_WORKSPACE/build/Build/Products" -maxdepth 3 || true
            exit 1
          fi

          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "FAIL: Info.plist missing"
            exit 1
          fi

          if [ ! -f "$APP_PATH/App" ]; then
            echo "FAIL: App executable missing"
            exit 1
          fi

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          echo "Bundle identifier: $BUNDLE_ID"
          if [ "$BUNDLE_ID" != "com.m9voi.monoa" ]; then
            echo "FAIL: Unexpected bundle identifier: $BUNDLE_ID"
            exit 1
          fi

          PLATFORM=$(/usr/libexec/PlistBuddy -c "Print :DTPlatformName" "$APP_PATH/Info.plist" 2>/dev/null || echo "unknown")
          echo "Built platform: $PLATFORM"
          if [ "$PLATFORM" != "iphoneos" ]; then
            echo "FAIL: Expected iphoneos (device) build, got: $PLATFORM"
            exit 1
          fi

          echo "App.app verification PASSED"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Package unsigned IPA
        run: |
          set -e
          PACKAGE_DIR="$GITHUB_WORKSPACE/ipa_package"
          mkdir -p "$PACKAGE_DIR/Payload"
          cp -R "$APP_PATH" "$PACKAGE_DIR/Payload/App.app"

          cd "$PACKAGE_DIR"
          zip -r -y "$GITHUB_WORKSPACE/MONOA-unsigned.ipa" Payload > /dev/null

      - name: Verify IPA integrity
        run: |
          IPA_PATH="$GITHUB_WORKSPACE/MONOA-unsigned.ipa"

          if [ ! -f "$IPA_PATH" ]; then
            echo "FAIL: IPA not found"
            exit 1
          fi

          SIZE=$(stat -f%z "$IPA_PATH")
          echo "IPA size: $SIZE bytes"
          if [ "$SIZE" -le 0 ]; then
            echo "FAIL: IPA is zero bytes"
            exit 1
          fi

          echo "Listing contents:"
          unzip -l "$IPA_PATH"

          if ! unzip -l "$IPA_PATH" | grep -q "Payload/App.app/"; then
            echo "FAIL: Payload/App.app/ not found inside IPA"
            exit 1
          fi

          if ! unzip -l "$IPA_PATH" | grep -q "Payload/App.app/Info.plist"; then
            echo "FAIL: Info.plist not found inside IPA"
            exit 1
          fi

          echo "IPA integrity checks PASSED"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MONOA-unsigned-ipa
          path: MONOA-unsigned.ipa
          retention-days: 3
          if-no-files-found: error
